# Grant fprintd access to the GPIO controller, for the goodixmilan driver.
#
# fprintd.service ships DeviceAllow=char-usb_device / char-spi / char-hidraw.
# As soon as any DeviceAllow= is set, systemd switches the unit's device policy
# to "closed": everything not listed is denied. /dev/gpiochip* (char-gpiochip,
# major 254) is not listed, so open() on it returns EPERM inside fprintd.
#
# The GXFP3200 needs a pulse on its reset line to be brought back to a known
# state. Without that pulse the sensor still answers on SPI, so fprintd keeps
# offering fingerprint authentication, but every capture times out once the
# sensor has lost its configuration — typically after a suspend/resume cycle,
# with no way out short of a reboot.
#
# Installed as /etc/systemd/system/fprintd.service.d/10-goodixmilan-gpio.conf
[Service]
DeviceAllow=char-gpiochip rw
